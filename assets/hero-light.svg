<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="A collage: a torn strip of night sky with a moon and paper bats, and a menu bar taped across it. A cursor clicks the mug icon in the menu bar. The mug fills and steams, the brewCula mascot opens its eyes, and the caption changes from 'Your Mac can sleep' to 'Your Mac stays awake, until you click again.' Sandboxed, no network, no sudo.">
